server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # The SPA calls the API same-origin at /api/* (PUBLIC_API_BASE_URL=/api, baked at build time),
  # and this container reverse-proxies /api/* to the in-cluster API, stripping the /api prefix
  # (trailing slash on proxy_pass). Keeping UI + API on one origin lets a single Cloudflare Access
  # gate cover both, and the API needs no public hostname. The upstream short name resolves via the
  # pod's cluster DNS search domain, so the image stays namespace-agnostic; the service name is
  # stable (Helm fullnameOverride: open-b00ks -> open-b00ks-api).
  location /api/ {
    proxy_pass http://open-b00ks-api:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    # Receipt uploads are multipart (RECEIPT_MAX_BYTES defaults to 10 MiB) — allow headroom so the
    # proxy doesn't 413 before the API's own limit applies.
    client_max_body_size 12m;
  }

  location / {
    try_files $uri /index.html;
  }

  location = /healthz {
    return 200 'ok';
    add_header Content-Type text/plain;
  }
}
