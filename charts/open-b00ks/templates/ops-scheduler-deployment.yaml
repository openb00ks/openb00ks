{{- if .Values.opsScheduler.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "open-b00ks.fullname" . }}-ops-scheduler
  labels:
    {{- include "open-b00ks.labels" . | nindent 4 }}
    app.kubernetes.io/component: ops-scheduler
spec:
  # Single replica: the scheduler leases each due task via the DB (FOR UPDATE SKIP LOCKED), so >1 is
  # safe, but one is right for a recurring-task runner.
  replicas: 1
  selector:
    matchLabels:
      {{- include "open-b00ks.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ops-scheduler
  template:
    metadata:
      {{- with .Values.opsScheduler.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "open-b00ks.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: ops-scheduler
        {{- with .Values.opsScheduler.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: ops-scheduler
          image: {{ include "open-b00ks.opsSchedulerImage" . | quote }}
          imagePullPolicy: {{ .Values.opsScheduler.image.pullPolicy }}
          ports:
            - name: metrics
              containerPort: 9090
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
          envFrom:
            - configMapRef:
                name: {{ include "open-b00ks.fullname" . }}-config
          env:
            {{- range $key, $value := .Values.opsScheduler.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "open-b00ks.secretName" . }}
                  key: DATABASE_URL
            # db-backup R2/S3 credentials (only when BACKUP_S3_BUCKET is set in opsScheduler.env).
            # Optional so a deploy without offsite backups doesn't need them. Non-secret backup config
            # (bucket/endpoint/region/prefix/retention) is set via opsScheduler.env.
            - name: BACKUP_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "open-b00ks.secretName" . }}
                  key: BACKUP_S3_ACCESS_KEY_ID
                  optional: true
            - name: BACKUP_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "open-b00ks.secretName" . }}
                  key: BACKUP_S3_SECRET_ACCESS_KEY
                  optional: true
            # Typesense API key (only when search is enabled via opsScheduler.env.SEARCH_PROVIDER).
            # Needed for the search-reconcile task and, in decomposed-batch mode, vendor indexing +
            # retrieval. Optional so search-off deploys don't require it. TYPESENSE_URL comes from the
            # shared configmap.
            - name: TYPESENSE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "open-b00ks.secretName" . }}
                  key: TYPESENSE_API_KEY
                  optional: true
          securityContext:
            {{- toYaml .Values.opsScheduler.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.opsScheduler.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
