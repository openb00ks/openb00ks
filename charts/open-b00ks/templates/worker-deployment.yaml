apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "open-b00ks.fullname" . }}-worker
  labels:
    {{- include "open-b00ks.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      {{- include "open-b00ks.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      {{- with .Values.worker.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "open-b00ks.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
        {{- with .Values.worker.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "open-b00ks.workerImage" . | quote }}
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          ports:
            - name: metrics
              containerPort: 9090
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
          envFrom:
            - configMapRef:
                name: {{ include "open-b00ks.fullname" . }}-config
          env:
            {{- range $key, $value := .Values.worker.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "open-b00ks.secretName" . }}
                  key: DATABASE_URL
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "open-b00ks.secretName" . }}
                  key: OPENAI_API_KEY
                  optional: true
            - name: TYPESENSE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "open-b00ks.secretName" . }}
                  key: TYPESENSE_API_KEY
                  optional: true
            # S3/R2 receipt storage credentials (only when RECEIPT_STORAGE=s3). The worker's OCR stage
            # presigns the image URL for the vision model, so it needs read access to the bucket — the
            # same two keys the api uses. Optional so local-storage deploys don't require them.
            - name: RECEIPT_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "open-b00ks.secretName" . }}
                  key: RECEIPT_S3_ACCESS_KEY_ID
                  optional: true
            - name: RECEIPT_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "open-b00ks.secretName" . }}
                  key: RECEIPT_S3_SECRET_ACCESS_KEY
                  optional: true
          securityContext:
            {{- toYaml .Values.worker.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          {{- if .Values.receiptStorage.persistence.enabled }}
          volumeMounts:
            - name: receipts
              mountPath: /data/receipts
          {{- end }}
      {{- if .Values.receiptStorage.persistence.enabled }}
      volumes:
        - name: receipts
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-receipts" (include "open-b00ks.fullname" .)) .Values.receiptStorage.persistence.existingClaim }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
